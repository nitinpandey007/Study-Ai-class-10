<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyAI Class 10 V4</title><style>
body{margin:0;background:#0b1020;color:#fff;font-family:Arial;padding:18px}main{max-width:800px;margin:auto}.card{background:#141d33;padding:18px;border-radius:16px;margin:12px 0}input,textarea,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #405070;background:#0d1426;color:#fff}button{background:#7657ff;border:0;font-weight:bold}textarea{min-height:90px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.row{grid-template-columns:1fr}}#result{white-space:pre-wrap;line-height:1.5;background:#0a1020;padding:14px;border-radius:10px;min-height:150px}
</style></head><body><main><h1>🎓 StudyAI Class 10 — V4</h1><p>Chapter understanding + photo/PDF upload + AI study tools</p>
<div class="card"><div class="row"><div><b>Subject</b><input id="subject" placeholder="Science"></div><div><b>Chapter</b><input id="chapter" placeholder="Chapter 9 - Light"></div></div>
<b>What do you want?</b><textarea id="task" placeholder="Explain the whole chapter simply..."></textarea></div>
<div class="card"><b>📸 Upload chapter photos/PDF</b><input id="files" type="file" accept="image/*,.pdf" multiple><small>Select multiple pages if needed.</small></div>
<div class="card"><button onclick="run('Explain the whole chapter in simple language with important concepts, definitions, formulas and examples.')">📚 Whole Chapter</button><button onclick="run('Make exam-ready notes for the whole chapter.')">📝 Notes</button><button onclick="run('Create 20 important MCQs with four options and answers.')">✅ MCQs</button><button onclick="run('Create important questions with answers.')">❓ Q&A</button><button onclick="run('Create a 40-mark practice test and answer key.')">🧪 Test</button></div>
<div class="card"><b id="status">Ready</b><div id="result">Your AI result will appear here.</div></div></main>
<script>
async function run(q){let s=document.getElementById('subject').value.trim(),c=document.getElementById('chapter').value.trim(),t=document.getElementById('task');if(!t.value)t.value=q;if(!s||!c||!t.value){alert('Enter Subject, Chapter and task');return}let fd=new FormData();fd.append('subject',s);fd.append('chapter',c);fd.append('task',t.value);for(let f of document.getElementById('files').files)fd.append('files',f);document.getElementById('status').textContent='⏳ AI is working...';try{let r=await fetch('/api/study',{method:'POST',body:fd}),d=await r.json();if(!r.ok)throw Error(d.error);document.getElementById('result').textContent=d.result;document.getElementById('status').textContent='✅ Done'}catch(e){document.getElementById('status').textContent='❌ Error';document.getElementById('result').textContent=e.message}}
</script></body></html>
